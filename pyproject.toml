[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plotter-utils"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["vpype", "pyserial", "ipython", "ipywidgets", "segno"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["plotter_utils"]
