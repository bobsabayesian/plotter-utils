[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plotter-utils"
version = "0.1.0"
requires-python = ">=3.9"
# The core is just pyserial: that is all the G-code agent on the Pi Zero needs.
dependencies = ["pyserial"]

[project.optional-dependencies]
# Everything for the main machine: SVG processing, the tablet page, notebooks.
full = ["vpype", "ipython", "ipywidgets", "segno"]
test = ["pytest", "vpype", "ipython", "ipywidgets", "segno"]

[project.scripts]
plotter-agent = "plotter_utils.agent:main"

[tool.setuptools]
packages = ["plotter_utils"]
